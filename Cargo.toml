[workspace]
members = ["agent", "protocol", "runtime", "server"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/PaimonAllen/EasyManage"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls"] }
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "sync", "net"] }
tower-http = { version = "0.7.1", features = ["compression-full", "fs", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
